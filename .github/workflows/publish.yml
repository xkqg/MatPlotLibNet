name: Publish to NuGet

on:
  release:
    types: [published]
  # A release that `Create Release` makes for itself carries github-actions[bot] as its author, and GitHub does
  # not start a workflow from an event a bot token raised — so the release event alone published nothing on
  # v1.15.0, and every earlier release only worked because a human clicked it. This is the way back in: dispatch
  # it by hand for a tag whose packages never went out.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish from (e.g. v1.15.0).'
        required: true
        type: string

# Opt JS actions into Node 24 ahead of the Sept 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A tag publishes, and a package on nuget.org cannot be taken back. A tag on the commit before the version bump
      # would push the previous release again, every package skipped by --skip-duplicate and the run green with
      # nothing new; a typo tag (v.1.18.0 exists) reads the same. The tag, without an optional 'v' or 'v.', must be
      # the version the packages carry.
      - name: The tag names the version the packages carry
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          tag="${tag#v}"
          tag="${tag#.}"
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Src/MatPlotLibNet/MatPlotLibNet.csproj | head -n 1)
          test -n "$declared" || { echo "Src/MatPlotLibNet/MatPlotLibNet.csproj declares no <Version>"; exit 1; }
          test "$tag" = "$declared" || { echo "The tag $TAG names $tag; the packages carry $declared"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install Skia native deps
        # SkiaSharp 3.x on Linux requires libfontconfig1 + libfreetype6. Both Skia
        # tests AND Avalonia tests (which use Avalonia.Skia internally) need these.
        # Without them: `libSkiaSharp.so: cannot open shared library` blocks the
        # Test step, which blocks Pack, which blocks Push -- entire release fails.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore MatPlotLibNet.CI.slnf

      - name: Build
        run: dotnet build MatPlotLibNet.CI.slnf --no-restore --configuration Release

      - name: Test
        run: |
          dotnet run --project Tst/MatPlotLibNet/MatPlotLibNet.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Geo/MatPlotLibNet.Geo.Tests.csproj --no-build --configuration Release
          # Skia runs on the release job too: it is the backend every PNG and PDF goes through, and the job
          # that publishes is the last place to discover a native-library breakage.
          dotnet run --project Tst/MatPlotLibNet.Skia/MatPlotLibNet.Skia.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Blazor/MatPlotLibNet.Blazor.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Avalonia/MatPlotLibNet.Avalonia.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.AspNetCore/MatPlotLibNet.AspNetCore.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Interactive/MatPlotLibNet.Interactive.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.GraphQL/MatPlotLibNet.GraphQL.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.DataFrame/MatPlotLibNet.DataFrame.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Mcp/MatPlotLibNet.Mcp.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Verso/MatPlotLibNet.Verso.Tests.csproj --no-build --configuration Release
          # Not run here: Tst/MatPlotLibNet.Wiki. This job checks out the release TAG, and the wiki has no tags -- a clone
          # takes the wiki as it is today. A wiki that already shows a later release's API would then be compiled
          # against this older code and block the release. CI compiles the wiki on every push to main instead.

      - name: Pack
        run: dotnet pack MatPlotLibNet.CI.slnf --no-build --configuration Release --output nupkgs

      - name: Push to NuGet
        run: |
          count=$(ls nupkgs/*.nupkg 2>/dev/null | wc -l)
          echo "Pushing $count package(s)"
          test "$count" -gt 0 || { echo "Pack reported success and produced no package"; exit 1; }
          dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-platform:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A tag publishes, and a package on nuget.org cannot be taken back. A tag on the commit before the version bump
      # would push the previous release again, every package skipped by --skip-duplicate and the run green with
      # nothing new; a typo tag (v.1.18.0 exists) reads the same. The tag, without an optional 'v' or 'v.', must be
      # the version the packages carry.
      - name: The tag names the version the packages carry
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          tag="${tag#v}"
          tag="${tag#.}"
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Src/MatPlotLibNet/MatPlotLibNet.csproj | head -n 1)
          test -n "$declared" || { echo "Src/MatPlotLibNet/MatPlotLibNet.csproj declares no <Version>"; exit 1; }
          test "$tag" = "$declared" || { echo "The tag $TAG names $tag; the packages carry $declared"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install platform workloads
        run: dotnet workload install maui android

      - name: Build Skia
        run: dotnet build Src/MatPlotLibNet.Skia/MatPlotLibNet.Skia.csproj --configuration Release

      - name: Build MAUI
        run: dotnet build Src/MatPlotLibNet.Maui/MatPlotLibNet.Maui.csproj --configuration Release

      - name: Build WPF
        run: dotnet build Src/MatPlotLibNet.Wpf/MatPlotLibNet.Wpf.csproj --configuration Release

      - name: Test MAUI
        run: dotnet run --project Tst/MatPlotLibNet.Maui/MatPlotLibNet.Maui.Tests.csproj --configuration Release

      - name: Pack Skia
        run: dotnet pack Src/MatPlotLibNet.Skia/MatPlotLibNet.Skia.csproj --no-build --configuration Release --output nupkgs

      - name: Pack MAUI
        run: dotnet pack Src/MatPlotLibNet.Maui/MatPlotLibNet.Maui.csproj --no-build --configuration Release --output nupkgs

      - name: Pack WPF
        run: dotnet pack Src/MatPlotLibNet.Wpf/MatPlotLibNet.Wpf.csproj --no-build --configuration Release --output nupkgs

      # The loop pushed each package and said nothing about what it had done, so the step read the same
      # whether it pushed three packages, one, or none at all: an empty directory simply skips the body. That
      # matters at exactly the wrong moment -- a release where a pack step quietly produced nothing looks like
      # a release that went out. It now names what it is pushing, treats an empty directory as an error, and
      # checks each push where it happens rather than leaving the step's verdict to the last one.
      - name: Push to NuGet
        run: |
          $pkgs = @(Get-ChildItem nupkgs/*.nupkg)
          if ($pkgs.Count -eq 0) {
            throw "The pack steps reported success and produced no package; there is nothing to push."
          }
          Write-Host "Pushing $($pkgs.Count) package(s): $($pkgs.Name -join ', ')"
          foreach ($pkg in $pkgs) {
            dotnet nuget push $pkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet nuget push failed for $($pkg.Name) with exit code $LASTEXITCODE"
            }
          }

  # Was its own workflow (push-uno.yml), triggered separately by `release: published` — which silently did not
  # fire for a bot-authored release exactly like THIS workflow's own trigger (see the comment above), with no
  # shared ritual to catch it up. The miss compounds: EnablePackageValidation's baseline restore needs the
  # immediately-prior version already on nuget.org, so a skipped release here makes the NEXT release's restore
  # hard-fail too (measured: v1.21.0's Uno push never ran, so v1.22.0's failed with NU1102 "Unable to find
  # package MatPlotLibNet.Uno with version (= 1.21.0)" until both were pushed by hand). A job in THIS workflow
  # shares the one trigger and the one manual-catchup dispatch every other package already rides, so there is no
  # second ritual left to forget.
  publish-uno:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: The tag names the version the packages carry
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          tag="${tag#v}"
          tag="${tag#.}"
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Src/MatPlotLibNet/MatPlotLibNet.csproj | head -n 1)
          test -n "$declared" || { echo "Src/MatPlotLibNet/MatPlotLibNet.csproj declares no <Version>"; exit 1; }
          test "$tag" = "$declared" || { echo "The tag $TAG names $tag; the packages carry $declared"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Uno Platform requires the Uno SDK source generators (SKCanvasElement etc.), which are not part of any
      # dotnet workload — they install via Uno.Templates. That is the one thing this job needs that the other
      # two don't; nothing else about publishing Uno is actually special.
      - name: Install Uno templates
        run: dotnet new install Uno.Templates

      - name: Restore
        run: dotnet restore Src/MatPlotLibNet.Uno/MatPlotLibNet.Uno.csproj

      # A separate `dotnet pack --no-build` step (publish-core's and publish-platform's own pattern) fails here
      # with NETSDK1085 on MatPlotLibNet.Skia.csproj and MatPlotLibNet.csproj (run 40452305941, confirmed by
      # job log): packing Uno.csproj --no-build still resolves its ProjectReference to Skia, which is itself
      # multi-targeted (net10.0;net8.0) and references the equally multi-targeted core MatPlotLibNet.csproj --
      # that P2P TargetPath resolution invokes the referenced projects' own Build target, which collides with
      # the NoBuild=true global property Pack set. publish-core/publish-platform never hit this: each packs a
      # project directly, never through a reference to another multi-targeted packable one. Uno.csproj already
      # sets GeneratePackageOnBuild=true, and this Build step's own log already shows it producing the .nupkg
      # (`Successfully created package '.../MatPlotLibNet.Uno.1.23.0.nupkg'`) -- so there is nothing left for a
      # second Pack step to do; it only needs telling where to put what Build already made.
      - name: Build
        run: dotnet build Src/MatPlotLibNet.Uno/MatPlotLibNet.Uno.csproj --no-restore --configuration Release -p:PackageOutputPath=$(pwd)/nupkgs

      - name: Push to NuGet
        run: dotnet nuget push "nupkgs/MatPlotLibNet.Uno.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
