name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt all JS-based actions into Node.js 24 ahead of GitHub's Sept 2026 forced
# migration. Setting this now means we discover any incompatibility today (when
# we can fix it) instead of when the runner switches automatically.
# See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The wiki's code is compiled by a test (Tst/MatPlotLibNet.Wiki), as the README's samples are. GitHub keeps a
      # wiki as a repository of its own, so it is cloned beside this one, where it stands on a contributor's machine
      # and where the test looks for it. The address is the upstream one, not github.repository: a fork has no wiki
      # of its own, so a clone built from the fork's name would fail a contributor's run.
      - name: Clone the wiki beside the repository
        run: git clone --depth 1 https://github.com/xkqg/MatPlotLibNet.wiki.git ../MatPlotLibNet.wiki

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install Skia native deps
        # SkiaSharp 3.x on Linux needs libfontconfig1 + libfreetype6 — without them
        # `libSkiaSharp.so: cannot open shared library` blows up the Skia tests + any
        # PNG/PDF/GIF render path. Installing here (before any Skia-touching step) so
        # both build-and-test and the coverage job inherit working native libs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore MatPlotLibNet.CI.slnf

      - name: Build
        run: dotnet build MatPlotLibNet.CI.slnf --no-restore --configuration Release

      - name: Test
        run: |
          dotnet run --project Tst/MatPlotLibNet/MatPlotLibNet.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Geo/MatPlotLibNet.Geo.Tests.csproj --no-build --configuration Release
          # Skia tests added here so cross-platform native-lib breakage surfaces in
          # the FIRST CI job, not only in the coverage job. Previously discovered
          # too late because Skia was only run via the coverage measurement.
          dotnet run --project Tst/MatPlotLibNet.Skia/MatPlotLibNet.Skia.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Blazor/MatPlotLibNet.Blazor.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Avalonia/MatPlotLibNet.Avalonia.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.AspNetCore/MatPlotLibNet.AspNetCore.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Interactive/MatPlotLibNet.Interactive.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.GraphQL/MatPlotLibNet.GraphQL.Tests.csproj --no-build --configuration Release
          # DataFrame was built by the filter and never run here — eight suites guarded nine projects.
          dotnet run --project Tst/MatPlotLibNet.DataFrame/MatPlotLibNet.DataFrame.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Mcp/MatPlotLibNet.Mcp.Tests.csproj --no-build --configuration Release
          dotnet run --project Tst/MatPlotLibNet.Verso/MatPlotLibNet.Verso.Tests.csproj --no-build --configuration Release
          # The MAUI package needs a workload, but its suite compiles the package's sources into a plain net10.0
          # assembly and needs none, so it runs here beside the others (and again against the real build by the Windows job).
          dotnet run --project Tst/MatPlotLibNet.Maui/MatPlotLibNet.Maui.Tests.csproj --no-build --configuration Release
          # Every C# block of the wiki, compiled against the packages this job just built. Not in the coverage job: it
          # holds no product code to measure, and it compiles text rather than exercising a class.
          dotnet run --project Tst/MatPlotLibNet.Wiki/MatPlotLibNet.Wiki.Tests.csproj --no-build --configuration Release
          # The charts against matplotlib's own pictures (the references in Tst/MatPlotLibNet.Fidelity/Fixtures), scored by a
          # perceptual diff on this runner's own rasterizer. Not in the coverage job: it holds no product code to measure.
          dotnet run --project Tst/MatPlotLibNet.Fidelity/MatPlotLibNet.Fidelity.Tests.csproj --no-build --configuration Release

  # The packages that need a workload or a Windows SDK (MAUI, WPF, Uno) cannot be built on the Linux runner, so the
  # publish workflow was the first thing to build them -- after the tag, where a break (or an API change the pack's
  # compatibility check refuses against the previous release) cannot be undone for a package already pushed. This job
  # builds them on every push with the steps publish-platform uses, and runs their suites. It builds what it runs,
  # which is why these projects stay out of MatPlotLibNet.CI.slnf.
  windows-heads:
    runs-on: windows-latest
    # The job takes about ten minutes. Without a limit of its own a step that hangs is stopped by the runner's default of
    # six hours, and the run stays yellow all that time.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install platform workloads
        run: dotnet workload install maui android

      # Building MAUI also packs it (GeneratePackageOnBuild), which is where the API-compatibility check against the
      # previous release runs.
      - name: Build MAUI
        run: dotnet build Src/MatPlotLibNet.Maui/MatPlotLibNet.Maui.csproj --configuration Release

      - name: Build WPF
        run: dotnet build Src/MatPlotLibNet.Wpf/MatPlotLibNet.Wpf.csproj --configuration Release

      # What publish-uno installs: the Uno Platform's source generators come with Uno.Templates, not with a workload.
      - name: Install Uno templates
        run: dotnet new install Uno.Templates

      - name: Build Uno
        run: dotnet build Src/MatPlotLibNet.Uno/MatPlotLibNet.Uno.csproj --configuration Release

      # One step each: a failing native command in a multi-line PowerShell block does not stop the next one.
      - name: Test MAUI
        run: dotnet run --project Tst/MatPlotLibNet.Maui/MatPlotLibNet.Maui.Tests.csproj --configuration Release

      - name: Test WPF
        run: dotnet run --project Tst/MatPlotLibNet.Wpf/MatPlotLibNet.Wpf.Tests.csproj --configuration Release

      - name: Test Uno
        run: dotnet run --project Tst/MatPlotLibNet.Uno/MatPlotLibNet.Uno.Tests.csproj --configuration Release

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup PowerShell
        run: |
          # Linux runners include pwsh by default; this ensures consistency
          pwsh --version

      - name: Install Skia native deps
        run: |
          # SkiaSharp 3.x on Linux needs native libs that aren't on default Ubuntu
          # runners. Skia tests crash with `libSkiaSharp.so: cannot open shared
          # library` without these. Mirrors what the SkiaSharp NuGet docs prescribe
          # for headless server scenarios.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6

      - name: Install coverage tools
        run: |
          # dotnet-coverage is Microsoft's official cross-platform coverage collector
          # for the Microsoft Testing Platform that xUnit v3 runs on. Replaced
          # coverlet.console after its 10.0.0 release (2026-04-17) silently captured
          # zero coverage on Ubuntu runners — see tools/coverage/run.sh header.
          dotnet tool install --global dotnet-coverage
          dotnet tool install --global dotnet-reportgenerator-globaltool
          # Make global tools visible
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run coverage + threshold gate
        run: |
          # Builds, collects, merges, then check-thresholds.ps1 --strict fails the
          # job if any class is below 90/90 absolute thresholds or regressed vs baseline.
          chmod +x tools/coverage/run.sh
          bash tools/coverage/run.sh --check --strict

      - name: Upload coverage report (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: out/coverage/
          retention-days: 14

