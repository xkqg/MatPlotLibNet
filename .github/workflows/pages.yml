name: GitHub Pages — Cookbook + API Reference

on:
  push:
    branches: [main]
  workflow_dispatch:

# Opt JS actions into Node 24 ahead of the Sept 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Install DocFx
        run: dotnet tool install -g docfx

      - name: Restore & Build
        run: |
          dotnet restore MatPlotLibNet.CI.slnf
          dotnet build MatPlotLibNet.CI.slnf --no-restore --configuration Release

      # Sample images are committed in images/ (generated locally where SkiaSharp
      # native libraries are available). No need to regenerate on CI.
      - name: Copy images to docs
        run: cp -r images docs/images

      - name: Build DocFx site
        run: |
          docfx metadata docs/docfx.json
          cp docs/api-toc.yml docs/api/toc.yml
          docfx build docs/docfx.json

      # docfx writes the sitemap as UTF-8 WITH a byte-order mark, and those three bytes sit in front of the XML
      # declaration. Search Console read the file and answered "Sitemap could not be read" with 0 pages
      # discovered, while the file itself conformed: 766 urls, every one inside the property, no duplicates,
      # valid priorities and lastmods, served as application/xml over a 200. The mark is the only thing about it
      # that is not plain XML, so it goes.
      - name: Strip the byte-order mark from the sitemap
        run: |
          sed -i '1s/^\xEF\xBB\xBF//' docs/_site/sitemap.xml
          head -c 5 docs/_site/sitemap.xml | od -c | head -1

      # docfx gives a page a title and a description and stops there. Two things it still needs cannot be
      # switched on from docfx's own configuration — the one address it should be indexed under, and the card
      # a link to it renders as — so the built site is finished here instead of by forking docfx's template.
      # The tool runs its own cases first and the result is verified, because a step that silently does
      # nothing is worse than no step at all.
      - name: Give every page an address and a preview card
        run: |
          python3 tools/seo/page-metadata.py --self-test
          python3 tools/seo/page-metadata.py --site docs/_site --base-url https://xkqg.github.io/MatPlotLibNet/ --apply
          python3 tools/seo/page-metadata.py --site docs/_site --verify

      - name: Publish Blazor WASM Playground
        run: dotnet publish Samples/MatPlotLibNet.Playground/MatPlotLibNet.Playground.csproj -c Release -o playground-out

      - name: Copy Playground to site
        run: cp -r playground-out/wwwroot docs/_site/playground

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A search engine finds a change by coming back to look for it. IndexNow turns that around: the site
      # names the addresses that changed and they are fetched within hours, by Bing, Yandex, DuckDuckGo and
      # Copilot, without an account anywhere. The key has been published since the sitemap landed and nothing
      # had ever submitted a single URL with it. This runs after the deployment, because a crawler sent to a
      # page that is not live yet reads the one it replaces. A manual run resubmits the whole sitemap.
      - name: Tell IndexNow which pages changed
        run: |
          python3 tools/seo/indexnow.py --self-test
          SITE=https://xkqg.github.io/MatPlotLibNet/
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "${{ github.sha }}" \
              | python3 tools/seo/indexnow.py --base-url "$SITE" --key-dir docs --changed - --submit
          else
            python3 tools/seo/indexnow.py --base-url "$SITE" --key-dir docs --sitemap --submit
          fi
