name: Create Release

on:
  push:
    tags:
      # Both spellings: v1.14.2 carried the prefix, 1.14.3 and 1.14.4 did not, and a 'v*'-only trigger let those
      # two slip past, so their releases had to be made by hand.
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

# Opt JS actions into Node 24 ahead of the Sept 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release (idempotent)
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Skip creation if a release for this tag already exists — the maintainer may have posted it from the
          # GitHub UI, or from the API, which is in fact the route that makes publish.yml fire at all: a release
          # this workflow creates for itself carries a bot as its author, and GitHub starts nothing from that.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
