name: Create Release

on:
  push:
    tags:
      # Both spellings: v1.14.2 carried the prefix, 1.14.3 and 1.14.4 did not, and a 'v*'-only trigger let those
      # two slip past — their releases had to be made by hand and nothing was announced.
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

# Opt JS actions into Node 24 ahead of the Sept 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release (idempotent)
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Skip creation if a release for this tag already exists (e.g. user created it
          # manually via the GitHub UI, or a parallel workflow beat us to it). The social
          # announcements below only need the release URL, which we can always look up.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Social media announcements — each step is gated by its secrets.
      # Configure in repo Settings > Secrets > Actions.
      # ---------------------------------------------------------------

      - name: Post to Bluesky
        if: env.BLUESKY_HANDLE != ''
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TAG: ${{ steps.create_release.outputs.tag }}
          URL: ${{ steps.create_release.outputs.url }}
        run: |
          set -euo pipefail
          TEXT="MatPlotLibNet ${TAG} released — matplotlib for .NET with 83 series types, 3D charts, an MCP server so an AI agent can draw with it, native Avalonia + Uno controls, and SignalR interactivity. MIT licensed. ${URL}"

          # jq builds every body below. Hand-quoted JSON inside a shell string breaks the first time the text
          # carries a quote, a backslash or a newline, and it breaks quietly: the API answers 400 and nothing
          # here used to read the answer.
          SESSION=$(jq -n --arg id "$BLUESKY_HANDLE" --arg pw "$BLUESKY_APP_PASSWORD" '{identifier:$id, password:$pw}' | curl -sS -X POST https://bsky.social/xrpc/com.atproto.server.createSession -H "Content-Type: application/json" -d @-)
          DID=$(echo "$SESSION" | jq -r '.did // empty')
          TOKEN=$(echo "$SESSION" | jq -r '.accessJwt // empty')
          [ -n "$DID" ] && [ -n "$TOKEN" ] || { echo "Bluesky login failed:"; echo "$SESSION"; exit 1; }

          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          CODE=$(jq -n --arg repo "$DID" --arg text "$TEXT" --arg now "$NOW" '{repo:$repo, collection:"app.bsky.feed.post", record:{"$type":"app.bsky.feed.post", text:$text, createdAt:$now}}' | curl -sS -o /tmp/bsky.json -w '%{http_code}' -X POST https://bsky.social/xrpc/com.atproto.repo.createRecord -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d @-)
          echo "Bluesky HTTP $CODE"; cat /tmp/bsky.json; echo
          [ "$CODE" -lt 400 ] || exit 1

      - name: Post to Mastodon
        if: env.MASTODON_ACCESS_TOKEN != ''
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          TAG: ${{ steps.create_release.outputs.tag }}
          URL: ${{ steps.create_release.outputs.url }}
        run: |
          set -euo pipefail
          # Built line by line rather than as one quoted block: a multi-line string inside this YAML carries the
          # YAML's own indentation into the post, which arrives as ten stray spaces in front of every line.
          HEAD="MatPlotLibNet ${TAG} released — matplotlib for .NET with 83 series types, 3D charts, an MCP server so an AI agent can draw with it, native Avalonia + Uno controls, and SignalR interactivity. MIT licensed."
          TAGS="#dotnet #csharp #dataviz #charting #opensource"
          TEXT=$(printf '%s\n\n%s\n\n%s' "$HEAD" "$URL" "$TAGS")

          CODE=$(curl -sS -o /tmp/masto.json -w '%{http_code}' -X POST "https://${MASTODON_INSTANCE}/api/v1/statuses" -H "Authorization: Bearer ${MASTODON_ACCESS_TOKEN}" -F "status=${TEXT}" -F "visibility=public")
          echo "Mastodon HTTP $CODE"; cat /tmp/masto.json; echo
          [ "$CODE" -lt 400 ] || exit 1

      - name: Post to LinkedIn
        if: env.LINKEDIN_ACCESS_TOKEN != ''
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          # LinkedIn dates its API by month and keeps a version alive for roughly a year; a stale one comes back
          # as 426 Upgrade Required. Override it without touching this file by setting the repository VARIABLE
          # LINKEDIN_API_VERSION under Settings > Secrets and variables > Actions > Variables.
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202609' }}
          TAG: ${{ steps.create_release.outputs.tag }}
          URL: ${{ steps.create_release.outputs.url }}
        run: |
          set -euo pipefail
          # /v2/ugcPosts is the legacy endpoint — LinkedIn stopped handing it to new integrations in 2023 and no
          # longer promises it works. /rest/posts is what a freshly created app is allowed to call, and it wants
          # the LinkedIn-Version and X-Restli-Protocol-Version headers with every request.
          HEAD="MatPlotLibNet ${TAG} released — matplotlib for .NET with 83 series types, 3D charts, an MCP server so an AI agent can draw with it, native Avalonia + Uno controls, and SignalR interactivity. MIT licensed."
          TEXT=$(printf '%s\n\n%s' "$HEAD" "$URL")

          CODE=$(jq -n --arg author "$LINKEDIN_PERSON_URN" --arg text "$TEXT" '{author:$author, commentary:$text, visibility:"PUBLIC", distribution:{feedDistribution:"MAIN_FEED", targetEntities:[], thirdPartyDistributionChannels:[]}, lifecycleState:"PUBLISHED", isReshareDisabledByAuthor:false}' | curl -sS -o /tmp/li.json -w '%{http_code}' -X POST https://api.linkedin.com/rest/posts -H "Authorization: Bearer ${LINKEDIN_ACCESS_TOKEN}" -H "LinkedIn-Version: ${LINKEDIN_VERSION}" -H "X-Restli-Protocol-Version: 2.0.0" -H "Content-Type: application/json" -d @-)
          echo "LinkedIn HTTP $CODE"; cat /tmp/li.json; echo
          [ "$CODE" -lt 400 ] || exit 1
